[project]
name = "fairspec-python"
version = "0.0.0-dev"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
lint.ignore = ["E501"]
extend-exclude = [
  "__pycache__",
  ".eggs",
  ".git",
  ".venv",
  "build",
  "dist",
  ".cache",
]

[tool.semantic_release]
commit_parser = "conventional"
allow_zero_version = true
version_toml = [
  "pyproject.toml:project.version",
  "dataset/pyproject.toml:project.version",
  "fairspec/pyproject.toml:project.version",
  "library/pyproject.toml:project.version",
  "metadata/pyproject.toml:project.version",
  "table/pyproject.toml:project.version",
  "terminal/pyproject.toml:project.version",
]

[tool.taskipy.tasks]
build = "uv build --all-packages --out-dir build"
coverage = "sensible-browser htmlcov/index.html"
format = "ruff format"
install = "uv sync --all-packages && ([ \"$CI\" = 'true' ] || lefthook install)"
lint = "ruff check"
publish = "uv publish build/*"
spec = "pytest --cov --cov-report html --cov-report json"
test = "task lint && task type && task spec"
type = "ty check"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = "*_spec.py"
filterwarnings = ["error::UserWarning"]

[tool.coverage.run]
source = [
  "fairspec_metadata",
  "fairspec_dataset",
  "fairspec_table",
  "fairspec_library",
  "fairspec_terminal",
]

[tool.ty.rules]
index-out-of-bounds = "ignore"

[tool.uv]
package = false
dev-dependencies = [
  "lefthook==1.11.13",
  "python-semantic-release==10.5.3",
  "pytest==9.0.2",
  "ruff==0.15.0",
  "taskipy==1.14.1",
  "ty==0.0.15",
  "pytest-recording==0.13.4",
  "pytest-cov>=7.0.0",
]

[tool.uv.workspace]
members = ["dataset", "fairspec", "library", "metadata", "table", "terminal"]

[tool.uv.sources]
fairspec = { workspace = true }
fairspec-dataset = { workspace = true }
fairspec-library = { workspace = true }
fairspec-metadata = { workspace = true }
fairspec-table = { workspace = true }
fairspec-terminal = { workspace = true }
